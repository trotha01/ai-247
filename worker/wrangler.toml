name = "ai247-live"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Placeholder bucket name: Trevor creates the real bucket (see docs/DAY2.md). No deploy is done by CI.
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "ai247-media"

# Episode history for topic/story dedupe (docs/TOPICS.md "Persistence"): written by the day1 job through the
# Cloudflare REST API, read here at /history.json. deploy.yml looks the database up by name (creating it if missing),
# writes its id into this line before `wrangler deploy`, and applies migrations/. The id is not a secret.
[[d1_databases]]
binding = "DB"
database_name = "ai247-history"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[vars]
# R2 key prefix of manifest.json + segments ("" = bucket root). See docs/R2_LAYOUT.md. Override per deploy: --var PREFIX:bulletins/live/
PREFIX = ""
WINDOW = "5"
# Fallback epoch (unix seconds) when manifest.json has no "epoch". Fixed so the clock is stable across deploys.
EPOCH = "1793000000"
# Replay-pool failover (docs/FAILOVER.md). POOL_KEY is read under PREFIX. MAX_MANIFEST_AGE_S = 0 disables the
# staleness rule (a looping manifest is still valid content); CHECK_SEGMENTS upcoming live segments are HEADed on
# every manifest reload (10 s); FAILOVER_MIN_S is the minimum time on the pool before returning to a healthy manifest.
POOL_KEY = "pool/manifest.json"
MAX_MANIFEST_AGE_S = "0"
CHECK_SEGMENTS = "5"
FAILOVER_MIN_S = "30"
