name = "ai247-live"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Placeholder bucket name: Trevor creates the real bucket (see docs/DAY2.md). No deploy is done by CI.
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "ai247-media"

[vars]
# R2 key prefix of manifest.json + segments ("" = bucket root). See docs/R2_LAYOUT.md. Override per deploy: --var PREFIX:bulletins/live/
PREFIX = ""
WINDOW = "5"
# Fallback epoch (unix seconds) when manifest.json has no "epoch". Fixed so the clock is stable across deploys.
EPOCH = "1793000000"
# Replay-pool failover (docs/FAILOVER.md). POOL_KEY is read under PREFIX. MAX_MANIFEST_AGE_S: a live manifest.json
# older than this (R2 upload time) fails over to the pool; 0 disables the rule. 14400 = 4 h, one missed run of the
# 3-hourly day1-episode cron (23 */3, up to 35 min) plus slack. CHECK_SEGMENTS upcoming live segments are HEADed on
# every manifest reload (10 s); FAILOVER_MIN_S is the minimum time on the pool before returning to a healthy manifest.
POOL_KEY = "pool/manifest.json"
MAX_MANIFEST_AGE_S = "14400"
CHECK_SEGMENTS = "5"
FAILOVER_MIN_S = "30"
