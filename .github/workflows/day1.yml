name: day1-episode

# Day 1: render one 10-minute episode as 6 s HLS segments + manifest, plus the slate loop and replay pool.
# Triggers: manual (workflow_dispatch) and a 3-hourly cron (unattended). To stop the cron without a commit, either set
# the repo variable DAY1_CRON_ENABLED to "false" or run: gh workflow disable day1-episode -R trotha01/ai-247
#
# Scheduled runs: GitHub fires `schedule` only from this file on the default branch (main), at most every 5 minutes,
# delayed or dropped under load, and switches the cron off after 60 days without repository activity. A cron run has
# no `inputs`, so every `inputs.*` expression below is empty: TTS = kokoro (espeak-ng fallback) and the Claude Haiku
# writer is ON when the ANTHROPIC_API_KEY secret exists (extractive script otherwise). The per-run Claude cap
# (NEWSBOT_MAX_RUN_USD, 0.05 USD) is a preflight guard: a call that could cross it is not made, the rest of the
# rundown goes extractive and `budget_abort` is recorded, so the cap never fails a run. 8 runs/day at ~0.005 USD
# each is ~1.2 USD/month, inside the 10 USD monthly limit of docs/PLAN.md.
on:
  workflow_dispatch:
    inputs:
      tts:
        description: "Force TTS engine (blank = kokoro with espeak-ng fallback)"
        required: false
        default: ""
        type: choice
        options: ["", "kokoro", "espeak-ng"]
      llm:
        description: "Claude Haiku script + fact check (needs the ANTHROPIC_API_KEY secret); off = extractive script"
        required: false
        default: "on"
        type: choice
        options: ["on", "off"]
      mode:
        description: "topic = research one topic (docs/TOPICS.md); feeds = the old general digest"
        required: false
        default: "topic"
        type: choice
        options: ["topic", "feeds"]
      topic:
        description: "Force a topic id from topics/topics.json (blank = best freshness x novelty score)"
        required: false
        default: ""
        type: string
      plan_model:
        description: "Model for the one topic plan call (writer/checker stay on Haiku)"
        required: false
        default: "claude-haiku-5-5"
        type: choice
        options: ["claude-haiku-5-5", "claude-sonnet-5-5"]
  schedule:
    - cron: "23 */3 * * *"   # off the top of the hour: GitHub delays/drops scheduled runs under load at :00

permissions:
  contents: write  # the run commits episodes/history.json (+ topics/topics.json when a topic is discovered) back to its branch
  actions: read    # to fetch earlier episode artifacts for the replay pool

concurrency:
  group: day1-episode
  cancel-in-progress: false

jobs:
  episode:
    # never on forks; cron can be switched off with the DAY1_CRON_ENABLED variable
    if: github.repository == 'trotha01/ai-247' && (github.event_name != 'schedule' || vars.DAY1_CRON_ENABLED != 'false')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Trigger
        # One line per run saying how it was started (schedule vs dispatch). No secrets, no variables echoed.
        run: echo "event=${{ github.event_name }} ref=${{ github.ref_name }} sha=${{ github.sha }} run=${{ github.run_id }} attempt=${{ github.run_attempt }}"

      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Runner specs
        run: |
          echo "nproc: $(nproc)"; free -m | head -2; lscpu | grep -E "Model name"; df -h . | tail -1

      - name: Install system + python deps
        # Hung twice for 20+ min with no output after apt finished (pip -q downloading large wheels), so: hard
        # step timeout, bounded apt/pip network timeouts, and up to 3 attempts of the whole step body.
        timeout-minutes: 8
        run: |
          start=$SECONDS
          APT="sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30"
          for attempt in 1 2 3; do
            if $APT update -qq \
               && $APT install -y -qq libegl1 libgl1 libgles2 libfontconfig1 fonts-dejavu-core espeak-ng \
               && { command -v ffmpeg >/dev/null || $APT install -y -qq ffmpeg; } \
               && timeout 300 pip install --timeout 60 --retries 3 -r requirements.txt; then
              echo "install stage: $((SECONDS-start)) s (attempt $attempt)"; exit 0
            fi
            echo "install attempt $attempt failed; retrying in 10 s"; sleep 10
          done
          echo "install failed after 3 attempts"; exit 1

      - uses: actions/cache@v6
        with:
          path: models
          key: kokoro-int8-v1.0

      - name: Fetch earlier episodes for the replay pool (best effort)
        # `--workflow` takes the workflow FILE name (day1.yml); "day1-episode.yml" was a 404 on every run, so no replay
        # was ever fetched (the R2 publish takes its replays from the live manifest instead and is unaffected).
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p replays
          ids=$(gh run list -R "$GITHUB_REPOSITORY" --workflow day1.yml --status success --limit 3 --json databaseId -q '.[].databaseId' || true)
          for id in $ids; do
            gh run download "$id" -R "$GITHUB_REPOSITORY" -n episode-day1 -D "replays/$id" || echo "no artifact for run $id"
          done
          ls replays || true

      - name: Render episode (hard limit 25 minutes)
        timeout-minutes: 25
        env:
          # Secret is empty when unset; it is read by the SDK from the environment and never echoed.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEWSBOT_NO_LLM: ${{ inputs.llm == 'off' && '1' || '' }}
          # Topic research stage (docs/TOPICS.md). Cron: topic mode unless the repo variable DAY1_TOPIC_MODE is "off".
          NEWSBOT_TOPIC_MODE: ${{ (inputs.mode == 'feeds' || vars.DAY1_TOPIC_MODE == 'off') && 'off' || 'on' }}
          NEWSBOT_TOPIC: ${{ inputs.topic }}
          NEWSBOT_PLAN_MODEL: ${{ inputs.plan_model || 'claude-haiku-5-5' }}
        run: |
          start=$SECONDS
          replay=""
          for d in replays/*/episode; do [ -d "$d" ] && replay="$replay --replay-dir $d"; done
          python -m newsbot.day1 --out out1 $replay ${{ inputs.tts != '' && format('--tts {0}', inputs.tts) || '' }}
          echo "pipeline wall-clock: $((SECONDS-start)) s"

      - name: Print run report (no secrets in it)
        if: always()
        run: cat out1/report.json | head -c 6000 || true

      - name: Tests (Day 1 units + seam on the real render)
        run: NEWSBOT_DAY1_OUT=out1 python -m pytest -v -s tests/test_day1_units.py tests/test_seam.py tests/test_day1_output.py tests/test_units.py tests/test_publish.py tests/test_topics.py

      - name: Publish to R2 (segments first, root manifest.json last; skipped without the R2 secrets)
        # Only after the render passed its tests. Layout: docs/R2_LAYOUT.md (B) + docs/MANIFEST-SWAP.md.
        # Secrets are empty when unset (forks, no secrets): the step prints one line and exits 0. Never echoed.
        timeout-minutes: 10
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python -m newsbot.publish out1

      - name: Record the episode (episodes/history.json, discovered topics) and commit it back
        # Dedupe memory for the next run (docs/TOPICS.md). Also mirrored to R2 as episodes/history.json so a failed
        # push only costs the git copy. A push by GITHUB_TOKEN triggers no other workflow. Never force-pushes.
        timeout-minutes: 5
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          python -m newsbot.topics record out1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add episodes/history.json topics/topics.json
          if git diff --cached --quiet; then echo "history unchanged"; exit 0; fi
          topic=$(python -c "import json;print((json.load(open('out1/episode/script.json')).get('topic') or {}).get('id') or 'general')")
          git commit -q -m "episode: record run ${GITHUB_RUN_ID} (topic ${topic}) [skip ci]"
          for attempt in 1 2 3; do
            if git pull -q --rebase origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME"; then
              echo "history pushed to $GITHUB_REF_NAME"; exit 0
            fi
            echo "push attempt $attempt failed; retrying in 10 s"; sleep 10
          done
          echo "::warning::history push failed; the entry is in the R2 mirror and the artifact"

      - name: Verify live playback (site/test/e2e-live.js; skipped when nothing was published)
        # Proof that https://ai-247.pages.dev plays right now, from the runner (the cloud sandbox is not always able to
        # reach pages.dev). The new bulletin airs at the next cycle boundary, so its presence is reported, not required.
        if: hashFiles('out1/publish.json') != ''
        continue-on-error: true
        timeout-minutes: 8
        run: |
          prefix=$(python -c "import json;print(json.load(open('out1/publish.json'))['prefix'])")
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw" && npm init -y >/dev/null && npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null
          cd "$GITHUB_WORKSPACE" && NODE_PATH="$RUNNER_TEMP/pw/node_modules" node site/test/e2e-live.js --expect-prefix "$prefix" --wait-sec 0 | tee out1/live_check.txt

      - name: Job summary
        if: always()
        run: python -m newsbot.summary1 out1 >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: episode-day1
          path: out1/
          retention-days: 14
