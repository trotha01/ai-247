name: day1-episode

# Day 1: render one 10-minute episode as 6 s HLS segments + manifest, plus the slate loop and replay pool.
# Triggers: manual (workflow_dispatch) and a 3-hourly cron (unattended). To stop the cron without a commit, either set
# the repo variable DAY1_CRON_ENABLED to "false" or run: gh workflow disable day1-episode -R trotha01/ai-247
#
# Scheduled runs: GitHub fires `schedule` only from this file on the default branch (main), at most every 5 minutes,
# delayed or dropped under load, and switches the cron off after 60 days without repository activity. A cron run has
# no `inputs`, so every `inputs.*` expression below is empty: TTS = kokoro (espeak-ng fallback), topic mode ON, the
# Claude Haiku writer ON when the ANTHROPIC_API_KEY secret exists (extractive script otherwise), plan + discovery on
# Claude Fable 5.1 at low effort. The per-run Claude cap (NEWSBOT_MAX_RUN_USD, 0.75 USD, repo variable overrides) is
# a preflight guard: a call that could cross it is not made, the rest of the rundown goes extractive and
# `budget_abort` is recorded, so the cap never fails a run. Expected 0.15-0.30 USD per episode, i.e. 1.2-2.4 USD/day
# on this cron (docs/TOPICS.md "Cost"); plan_model=claude-haiku-5-5 brings it back to ~0.01 USD per episode.
on:
  workflow_dispatch:
    inputs:
      tts:
        description: "Force TTS engine (blank = kokoro with espeak-ng fallback)"
        required: false
        default: ""
        type: choice
        options: ["", "kokoro", "espeak-ng"]
      llm:
        description: "Claude Haiku script + fact check (needs the ANTHROPIC_API_KEY secret); off = extractive script"
        required: false
        default: "on"
        type: choice
        options: ["on", "off"]
      mode:
        description: "topic = research one topic (docs/TOPICS.md); feeds = the old general digest"
        required: false
        default: "topic"
        type: choice
        options: ["topic", "feeds"]
      topic:
        description: "Force a topic id from topics/topics.json (blank = best freshness x novelty score)"
        required: false
        default: ""
        type: string
      plan_model:
        description: "Model for the topic plan and discovery calls, low effort (writer/checker stay on Haiku 5.5)"
        required: false
        default: "claude-fable-5-1"
        type: choice
        options: ["claude-fable-5-1", "claude-sonnet-5-5", "claude-haiku-5-5"]
  schedule:
    - cron: "23 */3 * * *"   # off the top of the hour: GitHub delays/drops scheduled runs under load at :00

permissions:
  contents: write  # only to commit topics/topics.json back to its branch when the discovery lane adds a topic (history is in D1)
  actions: read    # to fetch earlier episode artifacts for the replay pool

concurrency:
  group: day1-episode
  cancel-in-progress: false

jobs:
  episode:
    # never on forks; cron can be switched off with the DAY1_CRON_ENABLED variable
    if: github.repository == 'trotha01/ai-247' && (github.event_name != 'schedule' || vars.DAY1_CRON_ENABLED != 'false')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Trigger
        # One line per run saying how it was started (schedule vs dispatch) and the state of the cron switch.
        # DAY1_CRON_ENABLED is a repository *variable* (not a secret); the job-level `if` above skips a scheduled
        # run only when it is exactly "false". No secrets are echoed.
        env:
          CRON_SWITCH: ${{ vars.DAY1_CRON_ENABLED }}
        run: |
          echo "event=${{ github.event_name }} ref=${{ github.ref_name }} sha=${{ github.sha }} run=${{ github.run_id }} attempt=${{ github.run_attempt }}"
          echo "DAY1_CRON_ENABLED=${CRON_SWITCH:-<unset>}"

      - uses: actions/checkout@v7
        with:
          persist-credentials: false   # the write token is used only by the record step below, never left in .git/config

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Runner specs
        run: |
          echo "nproc: $(nproc)"; free -m | head -2; lscpu | grep -E "Model name"; df -h . | tail -1

      - name: Install system + python deps
        # Hung twice for 20+ min with no output after apt finished (pip -q downloading large wheels), so: hard
        # step timeout, bounded apt/pip network timeouts, and up to 3 attempts of the whole step body.
        timeout-minutes: 8
        run: |
          start=$SECONDS
          APT="sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30"
          for attempt in 1 2 3; do
            if $APT update -qq \
               && $APT install -y -qq libegl1 libgl1 libgles2 libfontconfig1 fonts-dejavu-core espeak-ng \
               && { command -v ffmpeg >/dev/null || $APT install -y -qq ffmpeg; } \
               && timeout 300 pip install --timeout 60 --retries 3 -r requirements.txt; then
              echo "install stage: $((SECONDS-start)) s (attempt $attempt)"; exit 0
            fi
            echo "install attempt $attempt failed; retrying in 10 s"; sleep 10
          done
          echo "install failed after 3 attempts"; exit 1

      - uses: actions/cache@v6
        with:
          path: models
          key: kokoro-int8-v1.0

      - name: Fetch earlier episodes for the replay pool (best effort)
        # `--workflow` takes the workflow FILE name (day1.yml); "day1-episode.yml" was a 404 on every run, so no replay
        # was ever fetched (the R2 publish takes its replays from the live manifest instead and is unaffected).
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p replays
          ids=$(gh run list -R "$GITHUB_REPOSITORY" --workflow day1.yml --status success --limit 3 --json databaseId -q '.[].databaseId' || true)
          for id in $ids; do
            gh run download "$id" -R "$GITHUB_REPOSITORY" -n episode-day1 -D "replays/$id" || echo "no artifact for run $id"
          done
          ls replays || true

      - name: Render episode (hard limit 25 minutes)
        timeout-minutes: 25
        env:
          # Secret is empty when unset; it is read by the SDK from the environment and never echoed.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEWSBOT_NO_LLM: ${{ inputs.llm == 'off' && '1' || '' }}
          # Topic research stage (docs/TOPICS.md). Cron: topic mode unless the repo variable DAY1_TOPIC_MODE is "off".
          NEWSBOT_TOPIC_MODE: ${{ (inputs.mode == 'feeds' || vars.DAY1_TOPIC_MODE == 'off') && 'off' || 'on' }}
          NEWSBOT_TOPIC: ${{ inputs.topic }}
          # Plan + discovery (web search) on Claude Fable 5.1 at low effort by default (docs/TOPICS.md "Cost").
          NEWSBOT_PLAN_MODEL: ${{ inputs.plan_model || 'claude-fable-5-1' }}
          NEWSBOT_DISCOVERY_MODEL: ${{ inputs.plan_model || 'claude-fable-5-1' }}
          NEWSBOT_MAX_RUN_USD: ${{ vars.NEWSBOT_MAX_RUN_USD || '0.75' }}
          # Episode history store (Cloudflare D1 via the REST API; R2 mirror as fallback). Empty when unset: the run
          # then reads/writes only the R2 mirror and the job summary says so.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          start=$SECONDS
          replay=""
          for d in replays/*/episode; do [ -d "$d" ] && replay="$replay --replay-dir $d"; done
          python -m newsbot.day1 --out out1 $replay ${{ inputs.tts != '' && format('--tts {0}', inputs.tts) || '' }}
          echo "pipeline wall-clock: $((SECONDS-start)) s"

      - name: Print run report (no secrets in it)
        if: always()
        run: cat out1/report.json | head -c 6000 || true

      - name: Tests (Day 1 units + seam on the real render)
        run: NEWSBOT_DAY1_OUT=out1 python -m pytest -v -s tests/test_day1_units.py tests/test_seam.py tests/test_day1_output.py tests/test_units.py tests/test_publish.py tests/test_topics.py tests/test_research.py

      - name: Publish to R2 (segments first, root manifest.json last; skipped without the R2 secrets)
        # Only after the render passed its tests. Layout: docs/R2_LAYOUT.md (B) + docs/MANIFEST-SWAP.md.
        # Secrets are empty when unset (forks, no secrets): the step prints one line and exits 0. Never echoed.
        timeout-minutes: 10
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python -m newsbot.publish out1

      - name: Record the episode in D1 (history) and commit a discovered topic back to topics.json
        # Dedupe memory for the next run (docs/TOPICS.md "Persistence"): the episode goes to Cloudflare D1 through the
        # REST API (R2 mirror episodes/history.json kept as a read cache); nothing about history is committed. Only a
        # topic the discovery lane added is committed (topics/topics.json, Trevor's editable list). A push by
        # GITHUB_TOKEN triggers no other workflow. Never force-pushes.
        timeout-minutes: 5
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_PUSH_TOKEN: ${{ github.token }}
        run: |
          python -m newsbot.topics record out1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add topics/topics.json
          if git diff --cached --quiet; then echo "no new topic discovered: nothing to commit"; exit 0; fi
          added=$(python -c "import json;print((json.load(open('out1/episode/topic_pick.json')).get('discovery') or {}).get('entry', {}).get('id') or 'topic')")
          git commit -q -m "topics: discovery added ${added} (run ${GITHUB_RUN_ID}) [skip ci]"
          remote="https://x-access-token:${GH_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"   # token only on this step's commands
          for attempt in 1 2 3; do
            if git pull -q --rebase "$remote" "$GITHUB_REF_NAME" && git push -q "$remote" "HEAD:$GITHUB_REF_NAME"; then
              echo "topics.json pushed to $GITHUB_REF_NAME"; exit 0
            fi
            echo "push attempt $attempt failed; retrying in 10 s"; sleep 10
          done
          echo "::warning::topics.json push failed; the new topic is in the artifact (out1/episode/topic_pick.json)"

      - name: Verify live playback (site/test/e2e-live.js; skipped when nothing was published)
        # Proof that https://ai-247.pages.dev plays right now, from the runner (the cloud sandbox is not always able to
        # reach pages.dev). The new bulletin airs at the next cycle boundary, so its presence is reported, not required.
        # continue-on-error so a flaky browser check never discards a rendered episode; the result is printed in the
        # job summary (out1/live_check.txt) and a FAIL line there is the signal to look at.
        if: hashFiles('out1/publish.json') != ''
        continue-on-error: true
        timeout-minutes: 8
        run: |
          prefix=$(python -c "import json;print(json.load(open('out1/publish.json'))['prefix'])")
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw" && npm init -y >/dev/null && npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null
          cd "$GITHUB_WORKSPACE" && NODE_PATH="$RUNNER_TEMP/pw/node_modules" node site/test/e2e-live.js --expect-prefix "$prefix" --wait-sec 0 | tee out1/live_check.txt

      - name: Job summary
        if: always()
        run: python -m newsbot.summary1 out1 >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: episode-day1
          path: out1/
          retention-days: 14
