name: secret-check

# Prints only "present" or "absent" for ANTHROPIC_API_KEY. Never prints the value or any other environment variable.
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/secret-check.yml"

permissions:
  contents: read

jobs:
  check:
    if: github.repository == 'trotha01/ai-247'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: ANTHROPIC_API_KEY present or absent
        env:
          K: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$K" ]; then echo "ANTHROPIC_API_KEY: present"; else echo "ANTHROPIC_API_KEY: absent"; fi
