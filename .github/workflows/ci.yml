name: ci

# Tests that need no secrets and no rendered output: units (mock Anthropic client) and seam tests on small real HLS blocks.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30   # install up to 20 (see below) + tests
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        # Same stall guard as day1/hourly: this step hung >10 min on run 42208590694 (no output inside pip install -q)
        # and timed out at 8 min on 2026-11-06 (runs 42244948815, 42255636564: slow apt mirror, then pip silent).
        # Each stage is bounded (apt 120 + 180 + 240 s, pip 200 s with a 20 s socket timeout: 12.3 min worst case per
        # attempt, same as hourly.yml after the ffmpeg install hit 120 s three times on run 42298386727), so 20 minutes
        # always allows a normal second attempt. Only apt packages are installed: this job runs on pull_request, so no
        # binary is fetched from outside the distro mirrors (a static ffmpeg fallback would need a pinned release and a
        # SHA-256 check before `sudo install`).
        timeout-minutes: 20
        run: |
          APT="sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30"
          for attempt in 1 2 3; do
            t0=$SECONDS; stage=apt-update
            if timeout 120 $APT update -qq \
               && { stage=apt-install; timeout 180 $APT install -y -qq libegl1 libgl1 libgles2 libfontconfig1 fonts-dejavu-core espeak-ng; } \
               && { stage=apt-ffmpeg; command -v ffmpeg >/dev/null || timeout 240 $APT install -y -qq ffmpeg; } \
               && { stage=pip; timeout 200 pip install --timeout 20 --retries 2 -r requirements.txt; }; then
              echo "install ok (attempt $attempt, $((SECONDS-t0)) s)"; exit 0
            fi
            echo "install attempt $attempt failed in stage $stage after $((SECONDS-t0)) s; retrying in 10 s"
            timeout 60 sudo dpkg --configure -a || true
            sleep 10
          done
          echo "install failed after 3 attempts"; exit 1
      - name: Tests (no ANTHROPIC_API_KEY in this job)
        run: python -m pytest -v tests/test_day1_units.py tests/test_seam.py tests/test_units.py tests/test_publish.py tests/test_replay_pool.py tests/test_topics.py tests/test_research.py tests/test_history_db.py tests/test_deploy_guard.py

  worker-site-e2e:
    # Worker unit + wrangler-dev tests, real-uploader -> local R2 -> Worker layout test, and the browser e2e of
    # site/ against the Worker (cross-origin, so it proves CORS). No secrets, no deploy, no network to Cloudflare.
    runs-on: ubuntu-24.04
    timeout-minutes: 35   # install up to 20 (see below) + Worker tests + browser e2e
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        # Timed out at 8 min with no output on 2026-11-06 (runs 42244338297, 42255636564) before any test ran: a
        # download stall in npm or the Playwright browser install. Every stage is bounded (apt 120 s x 2, npm 180 s x 2,
        # Playwright 240 s: 14 min worst case per attempt) and the whole thing is retried, like the Python install steps;
        # 20 minutes covers one worst-case attempt plus a normal one.
        timeout-minutes: 20
        run: |
          for attempt in 1 2 3; do
            t0=$SECONDS
            if { command -v ffmpeg >/dev/null || (timeout 120 sudo apt-get update -qq && timeout 120 sudo apt-get install -y -qq ffmpeg); } \
               && timeout 180 npm ci --prefix worker --fetch-timeout=30000 --fetch-retries=2 \
               && mkdir -p "$RUNNER_TEMP/tools" && cd "$RUNNER_TEMP/tools" \
               && { [ -f package.json ] || npm init -y >/dev/null; } \
               && timeout 180 npm install --silent --fetch-timeout=30000 --fetch-retries=2 hls.js@1.6.15 playwright@1.55.0 \
               && timeout 240 npx playwright install --with-deps chromium; then
              echo "install ok (attempt $attempt, $((SECONDS-t0)) s)"; exit 0
            fi
            cd "$GITHUB_WORKSPACE"
            echo "install attempt $attempt failed after $((SECONDS-t0)) s; retrying in 10 s"; sleep 10
          done
          echo "install failed after 3 attempts"; exit 1
      - name: Worker tests (unit, wrangler dev --local, uploader layout e2e)
        run: npm test --prefix worker
      - name: Site e2e against the Worker (?src=, cross-origin)
        run: node site/test/e2e-worker.js "$RUNNER_TEMP/tools/node_modules/hls.js/dist/hls.min.js"
        env:
          NODE_PATH: ${{ runner.temp }}/tools/node_modules
      - name: Puddle Park architecture page renders (light 1100 px, dark 360 px)
        # Paths on the page that live on the Puddle Park branch are only checked locally: workflows never touch that
        # code (tests/test_deploy_guard.py), so the check reports them as skipped here.
        run: node site/test/e2e-architecture.js "$RUNNER_TEMP/arch-shots"
        env:
          NODE_PATH: ${{ runner.temp }}/tools/node_modules
      - name: Upload architecture screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: puddle-architecture-screenshots
          path: ${{ runner.temp }}/arch-shots
          if-no-files-found: ignore
