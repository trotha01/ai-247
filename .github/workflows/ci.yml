name: ci

# Tests that need no secrets and no rendered output: units (mock Anthropic client) and seam tests on small real HLS blocks.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libgles2 libfontconfig1 fonts-dejavu-core espeak-ng
          command -v ffmpeg >/dev/null || sudo apt-get install -y -qq ffmpeg
          pip install -q -r requirements.txt
      - name: Tests (no ANTHROPIC_API_KEY in this job)
        run: python -m pytest -v tests/test_day1_units.py tests/test_seam.py tests/test_units.py
