name: replay-pool

# Replay pool (docs/FAILOVER.md): publishes pool/manifest.json to R2, the loop the Worker falls back to when
# manifest.json is missing, empty, stale or points at missing segments. Runs by hand (workflow_dispatch) and once a
# day (cron) to refresh the pool from the newest complete episodes already in R2. No notifier. Does nothing (and
# says so) when the R2_* secrets are not set.
#
# Guard (newsbot/replay_pool.py): the pool manifest is written only after every segment it lists was HEAD-checked
# in R2; with nothing complete to loop the script exits non-zero and writes nothing; and when the newest episodes
# are the ones the pool already lists, nothing is rewritten. A good pool/manifest.json is never replaced by an
# empty one. To stop the cron without a commit: set the repo variable REPLAY_POOL_CRON_ENABLED to "false" or run
# gh workflow disable replay-pool -R trotha01/ai-247
on:
  workflow_dispatch:
    inputs:
      source:
        description: "r2 = newest complete episodes already in R2 (bulletins/<ts>/); artifact = a workflow artifact (Day 0 bulletin or Day 1 episode) uploaded under pool/<id>/"
        required: true
        default: "r2"
        type: choice
        options: ["r2", "artifact"]
      run_id:
        description: "source=artifact: run id whose bulletin-day0 / episode-day1 artifact to loop (blank = latest successful day0 run)"
        required: false
        default: ""
      max_blocks:
        description: "source=r2: how many newest complete episodes to loop"
        required: false
        default: "2"
      force:
        description: "source=r2: rewrite pool/manifest.json even when it already lists the same segments"
        required: false
        default: false
        type: boolean
  schedule:
    # Daily, after the 03:23 UTC day1-episode cron run (23 */3, up to 35 min) has published; off the top of the hour.
    - cron: "41 4 * * *"

permissions:
  contents: read
  actions: read   # only to download an earlier artifact when source=artifact

concurrency:
  group: replay-pool
  cancel-in-progress: false

env:
  # workflow_dispatch inputs; on the cron they are empty, so these are the scheduled defaults.
  SOURCE: ${{ inputs.source || 'r2' }}
  MAX_BLOCKS: ${{ inputs.max_blocks || '2' }}
  FORCE: ${{ inputs.force == true && '--force' || '' }}

jobs:
  pool:
    # never on forks; the cron can be switched off with the REPLAY_POOL_CRON_ENABLED variable
    if: github.repository == 'trotha01/ai-247' && (github.event_name != 'schedule' || vars.REPLAY_POOL_CRON_ENABLED != 'false')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Check R2 secrets
        id: gate
        env:
          A: ${{ secrets.R2_ACCOUNT_ID }}
          K: ${{ secrets.R2_ACCESS_KEY_ID }}
          S: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          B: ${{ secrets.R2_BUCKET }}
        run: |
          if [ -z "$A" ] || [ -z "$K" ] || [ -z "$S" ] || [ -z "$B" ]; then
            echo "::warning::R2_* secrets are not set: nothing to do (no-op). Add the repo secrets and re-run this workflow."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "R2 secrets present"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v7
        if: steps.gate.outputs.ready == 'true'
        with:
          python-version: "3.12"

      - name: Install (boto3 only; no render deps needed)
        if: steps.gate.outputs.ready == 'true'
        timeout-minutes: 5
        run: timeout 240 pip install --timeout 60 --retries 3 "boto3>=1.34"

      - name: Fetch the artifact to loop (source=artifact)
        if: steps.gate.outputs.ready == 'true' && env.SOURCE == 'artifact'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id="${{ inputs.run_id }}"
          if [ -z "$id" ]; then
            id=$(gh run list -R "$GITHUB_REPOSITORY" --workflow day0-bulletin --status success --limit 1 --json databaseId -q '.[0].databaseId')
          fi
          echo "run id: $id"
          gh run download "$id" -R "$GITHUB_REPOSITORY" -D artifact
          if [ -d artifact/episode-day1/episode ]; then echo "POOL_DIR=artifact/episode-day1/episode" >> "$GITHUB_ENV"; echo "POOL_ID=episode-$id" >> "$GITHUB_ENV";
          elif [ -d artifact/bulletin-day0 ]; then echo "POOL_DIR=artifact/bulletin-day0" >> "$GITHUB_ENV"; echo "POOL_ID=bulletin-$id" >> "$GITHUB_ENV";
          else echo "no bulletin-day0 or episode-day1 artifact in run $id"; ls -R artifact | head -50; exit 1; fi

      - name: Build and publish the pool manifest (manifest written last; guarded, see header)
        if: steps.gate.outputs.ready == 'true'
        env:
          # Empty when unset; never echoed. The script skips R2 entirely without them.
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          # A Day 0 bulletin is 10 segments, an episode 100: anything smaller is not a pool.
          MIN_SEGMENTS: "10"
        run: |
          set -o pipefail
          echo "event: $GITHUB_EVENT_NAME, source: $SOURCE, max_blocks: $MAX_BLOCKS${FORCE:+, $FORCE}"
          if [ "$SOURCE" = "r2" ]; then
            python -m newsbot.replay_pool --from-r2 --max-blocks "$MAX_BLOCKS" --min-segments "$MIN_SEGMENTS" --write pool-manifest.json --upload $FORCE | tee publish.log
          else
            python -m newsbot.replay_pool --from-dir "$POOL_DIR" --id "$POOL_ID" --min-segments "$MIN_SEGMENTS" --write pool-manifest.json --upload $FORCE | tee publish.log
          fi

      - name: Verify pool/manifest.json in R2 and the Worker's /healthz
        if: steps.gate.outputs.ready == 'true'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          # The live Worker: repo variable WORKER_URL, else the host of streamUrl in site/config.json.
          WORKER_URL: ${{ vars.WORKER_URL }}
        # Reads pool/manifest.json back from R2 (must verify complete and list the same segments as
        # pool-manifest.json), then polls /healthz until pool.ok with this run's built_at (the Worker's pool cache
        # is 60 s). Writes healthz.json for the summary and the artifact.
        run: python scripts/pool_check.py --manifest pool-manifest.json --wait 150

      - name: Job summary
        if: always()
        run: |
          { echo '## Replay pool'; echo
            [ -f publish.log ] && { echo '```'; cat publish.log; echo '```'; echo; }
            [ -f healthz.json ] && { echo '### /healthz'; echo '```json'; head -c 3000 healthz.json; echo; echo '```'; echo; }
            echo '### pool manifest'; echo '```json'; head -c 4000 pool-manifest.json 2>/dev/null || echo '(no pool manifest written)'; echo; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: replay-pool-manifest
          path: |
            pool-manifest.json
            healthz.json
            publish.log
          retention-days: 14
          if-no-files-found: ignore
