name: replay-pool

# Replay-pool bootstrap (docs/FAILOVER.md): publishes pool/manifest.json to R2, the loop the Worker falls back to
# when manifest.json is missing, empty, stale or points at missing segments. Manual trigger only: no cron, no
# notifier. Does nothing (and says so) when the R2_* secrets are not set.
on:
  workflow_dispatch:
    inputs:
      source:
        description: "r2 = newest complete episode already in R2 (bulletins/<ts>/); artifact = a workflow artifact (Day 0 bulletin or Day 1 episode) uploaded under pool/<id>/"
        required: true
        default: "r2"
        type: choice
        options: ["r2", "artifact"]
      run_id:
        description: "source=artifact: run id whose bulletin-day0 / episode-day1 artifact to loop (blank = latest successful day0 run)"
        required: false
        default: ""
      max_blocks:
        description: "source=r2: how many newest complete episodes to loop"
        required: false
        default: "1"

permissions:
  contents: read
  actions: read   # only to download an earlier artifact when source=artifact

concurrency:
  group: replay-pool
  cancel-in-progress: false

jobs:
  pool:
    if: github.repository == 'trotha01/ai-247'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install (boto3 only; no render deps needed)
        timeout-minutes: 5
        run: timeout 240 pip install --timeout 60 --retries 3 "boto3>=1.34"

      - name: Fetch the artifact to loop (source=artifact)
        if: inputs.source == 'artifact'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id="${{ inputs.run_id }}"
          if [ -z "$id" ]; then
            id=$(gh run list -R "$GITHUB_REPOSITORY" --workflow day0-bulletin --status success --limit 1 --json databaseId -q '.[0].databaseId')
          fi
          echo "run id: $id"
          gh run download "$id" -R "$GITHUB_REPOSITORY" -D artifact
          if [ -d artifact/episode-day1/episode ]; then echo "POOL_DIR=artifact/episode-day1/episode" >> "$GITHUB_ENV"; echo "POOL_ID=episode-$id" >> "$GITHUB_ENV";
          elif [ -d artifact/bulletin-day0 ]; then echo "POOL_DIR=artifact/bulletin-day0" >> "$GITHUB_ENV"; echo "POOL_ID=bulletin-$id" >> "$GITHUB_ENV";
          else echo "no bulletin-day0 or episode-day1 artifact in run $id"; ls -R artifact | head -50; exit 1; fi

      - name: Build and publish the pool manifest (manifest written last)
        env:
          # Empty when unset; never echoed. The script skips R2 entirely without them.
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          if [ "${{ inputs.source }}" = "r2" ]; then
            python -m newsbot.replay_pool --from-r2 --max-blocks "${{ inputs.max_blocks }}" --write pool-manifest.json --upload
          else
            python -m newsbot.replay_pool --from-dir "$POOL_DIR" --id "$POOL_ID" --write pool-manifest.json --upload
          fi

      - name: Job summary
        if: always()
        run: |
          { echo '## Replay pool'; echo; echo '```json'; head -c 4000 pool-manifest.json 2>/dev/null || echo '(no pool manifest written)'; echo; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: replay-pool-manifest
          path: pool-manifest.json
          retention-days: 14
          if-no-files-found: ignore
